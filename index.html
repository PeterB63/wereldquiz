<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <link rel="apple-touch-icon" sizes="180x180" href="https://i.imgur.com/UPInlXl.png">
  <link rel="stylesheet" href="style.css?v=3">
  <title>Wereldquiz</title>
</head>	
    
  <body>
  <div id="startScreen" class="screen active">
  <div class="container">
    <div class="header">
      <h1>🌍 Wereldquiz</h1>
      <p class="subtitle">Test je kennis van landen, hoofdsteden en vlaggen</p>
    </div>

    <div class="hero">🗺️</div>

    <p class="intro">
      Kies het juiste antwoord uit 4 opties. Foute landen komen later opnieuw terug.
    </p>

    <button class="start-button" onclick="startQuiz()">Start quiz</button>
  </div>
</div>

<div id="quizScreen" class="screen">
  <div class="container">
    <div class="header">
      <h1>🌍 Wereldquiz</h1>
      <p class="subtitle" id="modeText"></p>
    </div>

    <p id="score"></p>

    <img id="flag" alt="Vlag">

    <h2 id="question"></h2>

    <div id="choices"></div>

    <button onclick="newQuestion()">Nieuwe vraag</button>
<button class="mode-button" onclick="setMode('countryToCapital')">🌍 Hoofdsteden</button>
<button class="mode-button" onclick="setMode('capitalToCountry')">🏙️ Landen</button>
<button class="mode-button" onclick="setMode('flagToCountry')">🏳️ Vlaggen</button>
    <button onclick="resetScore()">Reset score</button>

    <p id="result"></p>
  </div>
</div>
    <script  src="script.js?v=3"></script>

  </body>
  
</html>
